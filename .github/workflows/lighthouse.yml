name: Lighthouse CI

on:
  pull_request:
    branches: [main]
  schedule:
    # Her Pazartesi 06:00 UTC = 09:00 TR; haftalık production audit
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  lighthouse-pr:
    if: github.event_name == 'pull_request'
    name: Lighthouse on PR build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Start app
        run: npm run start &
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

      - name: Wait for ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run Lighthouse CI
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=./lighthouserc.json
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  lighthouse-prod:
    if: github.event_name != 'pull_request'
    name: Lighthouse on production (weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Lighthouse CI on production
        run: |
          npm install -g @lhci/cli@0.14.x
          lhci autorun --config=./lighthouserc.production.json
