<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90">
  <defs>
    <radialGradient id="p1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8DC63F"/>
      <stop offset="50%" stop-color="#4AAF32"/>
      <stop offset="100%" stop-color="#1A6B20"/>
    </radialGradient>
    <radialGradient id="p2" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#8DC63F"/>
      <stop offset="50%" stop-color="#4AAF32"/>
      <stop offset="100%" stop-color="#1A6B20"/>
    </radialGradient>
    <radialGradient id="p3" cx="30%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#8DC63F"/>
      <stop offset="50%" stop-color="#4AAF32"/>
      <stop offset="100%" stop-color="#1A6B20"/>
    </radialGradient>
    <radialGradient id="p4" cx="70%" cy="70%" r="70%">
      <stop offset="0%" stop-color="#8DC63F"/>
      <stop offset="50%" stop-color="#4AAF32"/>
      <stop offset="100%" stop-color="#1A6B20"/>
    </radialGradient>
    <radialGradient id="center" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C5E87A"/>
      <stop offset="100%" stop-color="#4AAF32"/>
    </radialGradient>
  </defs>

  <!-- 4-leaf clover: each petal is an ellipse rotated 45° -->
  <g transform="translate(45,45)">
    <!-- Top-left petal -->
    <ellipse cx="-10" cy="-10" rx="16" ry="10" transform="rotate(-45 -10 -10)" fill="url(#p1)"/>
    <!-- Top-right petal -->
    <ellipse cx="10" cy="-10" rx="16" ry="10" transform="rotate(45 10 -10)" fill="url(#p2)"/>
    <!-- Bottom-left petal -->
    <ellipse cx="-10" cy="10" rx="16" ry="10" transform="rotate(45 -10 10)" fill="url(#p3)"/>
    <!-- Bottom-right petal -->
    <ellipse cx="10" cy="10" rx="16" ry="10" transform="rotate(-45 10 10)" fill="url(#p4)"/>
    <!-- Center highlight -->
    <circle cx="0" cy="0" r="6" fill="url(#center)" opacity="0.9"/>
  </g>

  <!-- "Garanti" text - dark/near black, medium weight -->
  <text x="92" y="58" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="500" font-size="36" fill="#1A1A1A" letter-spacing="-0.5">Garanti</text>
  <!-- "BBVA" text - dark navy, heavy weight -->
  <text x="228" y="58" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="800" font-size="36" fill="#002D72" letter-spacing="1"> BBVA</text>
</svg>
