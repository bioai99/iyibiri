<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="face" cx="40%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#F4D98A"/>
      <stop offset="55%" stop-color="#E8C268"/>
      <stop offset="100%" stop-color="#B58F3D"/>
    </radialGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D98A"/>
      <stop offset="100%" stop-color="#8A6A2C"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#24201B"/>
  <!-- Outer ring (edge) -->
  <circle cx="256" cy="256" r="200" fill="url(#edge)"/>
  <!-- Face -->
  <circle cx="256" cy="256" r="180" fill="url(#face)"/>
  <!-- Inner groove -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="#8A6A2C" stroke-opacity=".4" stroke-width="3"/>
  <circle cx="256" cy="256" r="134" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="3"/>
  <!-- Monogram "i" -->
  <g transform="translate(256,256)">
    <circle cx="0" cy="-60" r="16" fill="#3E2F14"/>
    <path d="M-20 -20 L-20 80 L20 80 L20 -20 Z" fill="#3E2F14"/>
    <path d="M-40 80 L40 80 L40 66 L-40 66 Z" fill="#3E2F14"/>
  </g>
  <!-- Highlight -->
  <path d="M 100 160 Q 160 100 256 100" stroke="rgba(255,255,255,.45)" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>
