<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Konsept A: Dalga Etkisi — İyilik yap denize at
       Merkezdeki kalp/nokta dalga dalga yayılır.
       "i" harfi: gövde + kalp noktası + dalgalar -->

  <!-- Arka plan -->
  <rect width="512" height="512" rx="112" fill="#24201B"/>

  <!-- Dalgalar (dıştan içe) -->
  <circle cx="256" cy="220" r="160" fill="none" stroke="#E8C268" stroke-opacity=".08" stroke-width="2"/>
  <circle cx="256" cy="220" r="120" fill="none" stroke="#E8C268" stroke-opacity=".14" stroke-width="2"/>
  <circle cx="256" cy="220" r="80" fill="none" stroke="#E8C268" stroke-opacity=".22" stroke-width="2.5"/>

  <!-- "i" gövdesi — sıcak, yuvarlatılmış dikdörtgen -->
  <rect x="232" y="240" width="48" height="120" rx="24" fill="#E8C268"/>

  <!-- "i" noktası — kalp şekli -->
  <path d="M256 160
    C256 160 232 140 232 162
    C232 180 256 200 256 200
    C256 200 280 180 280 162
    C280 140 256 160 256 160Z"
    fill="#E8C268"/>

  <!-- Alt çizgi — zemin, kök -->
  <rect x="200" y="376" width="112" height="8" rx="4" fill="#E8C268" opacity=".5"/>

  <!-- Wordmark -->
  <text x="256" y="440" text-anchor="middle" font-family="'Fraunces', Georgia, serif" font-size="44" font-weight="500" fill="#F4EEDF" letter-spacing="-1">
    <tspan>İyi</tspan><tspan font-style="italic" fill="#E8C268">Biri</tspan>
  </text>
</svg>
