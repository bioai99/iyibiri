<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Konsept F: Gün Doğumu — Her iyilik bir ışık
       Ufuk çizgisi + yükselen güneş + ışınlar
       Sıcak, umut verici, yeni bir başlangıç -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#24201B"/>
      <stop offset="60%" stop-color="#2E2923"/>
      <stop offset="100%" stop-color="#3E2F14"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4D98A"/>
      <stop offset="50%" stop-color="#E8C268"/>
      <stop offset="100%" stop-color="#D19B3C"/>
    </radialGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#E8C268" stop-opacity=".3"/>
      <stop offset="100%" stop-color="#E8C268" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#sky)"/>

  <!-- Işık halesi -->
  <ellipse cx="256" cy="280" rx="200" ry="120" fill="url(#glow)"/>

  <!-- Işınlar -->
  <line x1="256" y1="180" x2="256" y2="130" stroke="#E8C268" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <line x1="310" y1="200" x2="340" y2="160" stroke="#E8C268" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <line x1="202" y1="200" x2="172" y2="160" stroke="#E8C268" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <line x1="350" y1="240" x2="385" y2="220" stroke="#E8C268" stroke-width="2" stroke-linecap="round" opacity=".3"/>
  <line x1="162" y1="240" x2="127" y2="220" stroke="#E8C268" stroke-width="2" stroke-linecap="round" opacity=".3"/>

  <!-- Güneş -->
  <circle cx="256" cy="260" r="60" fill="url(#sun)"/>
  <circle cx="246" cy="250" r="20" fill="#F4D98A" opacity=".3"/>

  <!-- Ufuk çizgisi -->
  <line x1="80" y1="300" x2="432" y2="300" stroke="#E8C268" stroke-width="2.5" opacity=".4"/>

  <!-- Yansıma dalgaları -->
  <path d="M120 320 Q160 312 200 320 Q240 328 280 320 Q320 312 360 320 Q400 328 432 320"
    stroke="#E8C268" stroke-width="1.5" fill="none" opacity=".15"/>
  <path d="M140 345 Q180 338 220 345 Q260 352 300 345 Q340 338 380 345"
    stroke="#E8C268" stroke-width="1" fill="none" opacity=".08"/>

  <!-- İnsan siluetleri ufukta (küçük) -->
  <circle cx="190" cy="290" r="6" fill="#C8553D" opacity=".7"/>
  <rect x="187" y="296" width="6" height="10" rx="2" fill="#C8553D" opacity=".5"/>

  <circle cx="230" cy="288" r="5" fill="#6B8E4E" opacity=".6"/>
  <rect x="227.5" y="293" width="5" height="9" rx="2" fill="#6B8E4E" opacity=".4"/>

  <circle cx="320" cy="289" r="5.5" fill="#E8C268" opacity=".6"/>
  <rect x="317.5" y="294.5" width="5" height="9" rx="2" fill="#E8C268" opacity=".4"/>
</svg>
