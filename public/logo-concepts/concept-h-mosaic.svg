<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Konsept H: Mozaik Kalp — Herkesin katkısı bir parça
       Kalp formu küçük geometrik parçalardan oluşur
       Her parça farklı renk = farklı insan, farklı iyilik
       Birlikte bir bütün oluştururlar -->
  <rect width="512" height="512" rx="112" fill="#24201B"/>

  <!-- Kalp ana formu - mozaik parçalarla dolu -->
  <g transform="translate(256, 240)">
    <!-- Üst sol parçalar -->
    <rect x="-80" y="-70" width="28" height="28" rx="4" fill="#E8C268" transform="rotate(-15 -66 -56)"/>
    <rect x="-50" y="-85" width="24" height="24" rx="4" fill="#C8553D" transform="rotate(5 -38 -73)"/>
    <rect x="-25" y="-95" width="22" height="22" rx="4" fill="#6B8E4E" transform="rotate(-8 -14 -84)"/>
    <rect x="-75" y="-40" width="26" height="26" rx="4" fill="#D4627A" transform="rotate(10 -62 -27)"/>
    <rect x="-48" y="-55" width="20" height="20" rx="4" fill="#E9CFC2" transform="rotate(-5 -38 -45)"/>

    <!-- Üst sağ parçalar (ayna) -->
    <rect x="52" y="-70" width="28" height="28" rx="4" fill="#6B8E4E" transform="rotate(15 66 -56)"/>
    <rect x="26" y="-85" width="24" height="24" rx="4" fill="#E8C268" transform="rotate(-5 38 -73)"/>
    <rect x="3" y="-95" width="22" height="22" rx="4" fill="#D19B3C" transform="rotate(8 14 -84)"/>
    <rect x="49" y="-40" width="26" height="26" rx="4" fill="#C8553D" transform="rotate(-10 62 -27)"/>
    <rect x="28" y="-55" width="20" height="20" rx="4" fill="#C4CBAC" transform="rotate(5 38 -45)"/>

    <!-- Orta parçalar -->
    <rect x="-15" y="-70" width="30" height="30" rx="5" fill="#E8C268"/>
    <rect x="-55" y="-10" width="24" height="24" rx="4" fill="#6B8E4E" transform="rotate(-5)"/>
    <rect x="31" y="-10" width="24" height="24" rx="4" fill="#D4627A" transform="rotate(5)"/>
    <rect x="-30" y="-15" width="22" height="22" rx="4" fill="#EADDB8"/>
    <rect x="8" y="-15" width="22" height="22" rx="4" fill="#C8553D"/>

    <!-- Alt parçalar (kalp sivri ucu) -->
    <rect x="-40" y="20" width="24" height="24" rx="4" fill="#E8C268" transform="rotate(-10 -28 32)"/>
    <rect x="16" y="20" width="24" height="24" rx="4" fill="#6B8E4E" transform="rotate(10 28 32)"/>
    <rect x="-25" y="45" width="20" height="20" rx="4" fill="#C8553D" transform="rotate(-15 -15 55)"/>
    <rect x="5" y="45" width="20" height="20" rx="4" fill="#E9CFC2" transform="rotate(15 15 55)"/>
    <rect x="-12" y="68" width="24" height="24" rx="5" fill="#E8C268" transform="rotate(0)"/>
    <rect x="-8" y="90" width="16" height="16" rx="3" fill="#D19B3C" transform="rotate(0)"/>
  </g>

  <!-- Parıltı efekti -->
  <circle cx="200" cy="150" r="3" fill="#E8C268" opacity=".3"/>
  <circle cx="320" cy="155" r="2.5" fill="#C8553D" opacity=".25"/>
  <circle cx="256" cy="130" r="2" fill="#6B8E4E" opacity=".3"/>
</svg>
