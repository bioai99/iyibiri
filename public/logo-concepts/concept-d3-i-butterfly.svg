<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- D3: "i" Kelebek — Gövde "i" harfi, kanatlar "İyiBiri"yi tamamlar
       i noktası = baş, i gövdesi = beden, kanatlar = iyilik
       Marka referansı güçlü -->
  <defs>
    <linearGradient id="wL3" x1="0" y1=".3" x2="1" y2=".7">
      <stop offset="0%" stop-color="#E8C268"/>
      <stop offset="100%" stop-color="#D19B3C"/>
    </linearGradient>
    <linearGradient id="wR3" x1="1" y1=".3" x2="0" y2=".7">
      <stop offset="0%" stop-color="#C8553D"/>
      <stop offset="100%" stop-color="#D4627A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#24201B"/>

  <!-- Sol kanat üst -->
  <path d="M240 230 C205 180 130 160 130 210 C130 255 200 270 240 250Z" fill="url(#wL3)"/>
  <!-- Sol kanat alt -->
  <path d="M240 260 C210 290 155 310 160 280 C165 255 210 250 240 260Z" fill="url(#wL3)" opacity=".6"/>

  <!-- Sağ kanat üst -->
  <path d="M272 230 C307 180 382 160 382 210 C382 255 312 270 272 250Z" fill="url(#wR3)"/>
  <!-- Sağ kanat alt -->
  <path d="M272 260 C302 290 357 310 352 280 C347 255 302 250 272 260Z" fill="url(#wR3)" opacity=".6"/>

  <!-- "i" gövdesi — yuvarlatılmış dikdörtgen -->
  <rect x="244" y="235" width="24" height="90" rx="12" fill="#F4EEDF"/>
  <!-- "i" serif ayağı -->
  <rect x="236" y="315" width="40" height="8" rx="4" fill="#F4EEDF" opacity=".7"/>

  <!-- "i" noktası — kalp şekli (iyilik sembolü) -->
  <path d="M256 185
    C256 185 240 172 240 185
    C240 196 256 210 256 210
    C256 210 272 196 272 185
    C272 172 256 185 256 185Z"
    fill="#F4EEDF"/>

  <!-- Kanat içi detaylar -->
  <circle cx="185" cy="215" r="10" fill="none" stroke="#F4EEDF" stroke-width="1.2" opacity=".15"/>
  <circle cx="327" cy="215" r="10" fill="none" stroke="#F4EEDF" stroke-width="1.2" opacity=".15"/>

  <!-- Antenler (ince, zarif) -->
  <path d="M252 185 C244 170 235 162 230 158" stroke="#F4EEDF" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/>
  <path d="M260 185 C268 170 277 162 282 158" stroke="#F4EEDF" stroke-width="2" fill="none" stroke-linecap="round" opacity=".5"/>
  <circle cx="228" cy="157" r="3" fill="#E8C268" opacity=".6"/>
  <circle cx="284" cy="157" r="3" fill="#C8553D" opacity=".6"/>
</svg>
